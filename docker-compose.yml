services:
  vh-warp:
    image: ghcr.io/lazzman/vh-warp:latest
    container_name: vh-warp
    restart: always
    # 上限而非预留。10 实例建议 ≥4g，详见 README「内存估算」
    mem_limit: 4g
    ports:
      # 负载均衡入口（默认 1110）+ 实例直连端口（1111 起，预留到 1142 支持最多 32 实例）
      - "${PORT_RANGE_START:-1110}-${PORT_RANGE_END:-1142}:${PORT_RANGE_START:-1110}-${PORT_RANGE_END:-1142}"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    environment:
      INSTANCE_COUNT: ${INSTANCE_COUNT:-1}
      BASE_PORT: ${BASE_PORT:-1111}
      LB_PORT: ${LB_PORT:-1110}
      LB_STRATEGY: ${LB_STRATEGY:-round}
      LB_ENABLED: ${LB_ENABLED:-auto}
      HEALTH_CHECK_INTERVAL: ${HEALTH_CHECK_INTERVAL:-60}
      HEALTH_SOFT_FAILURES: ${HEALTH_SOFT_FAILURES:-3}
      HEALTH_FALLBACK_AFTER: ${HEALTH_FALLBACK_AFTER:-600}
      # 可选：WARP 建连走上游 SOCKS5（需节点支持 UDP）。最终业务 IP 仍是 WARP
      # 例: socks5://user:pass@192.168.1.2:1086  或  192.168.1.2:1086
      UPSTREAM_SOCKS5: ${UPSTREAM_SOCKS5:-}
      UPSTREAM_SOCKS5_UDP: ${UPSTREAM_SOCKS5_UDP:-udp}
      UPSTREAM_MTU: ${UPSTREAM_MTU:-1280}
      GOST_IDLE_TIMEOUT: ${GOST_IDLE_TIMEOUT:-120s}
      GOST_READ_BUFFER: ${GOST_READ_BUFFER:-32768}
      GOST_WRITE_BUFFER: ${GOST_WRITE_BUFFER:-32768}
      GOST_BACKLOG: ${GOST_BACKLOG:-1024}
      LB_IDLE_TIMEOUT: ${LB_IDLE_TIMEOUT:-120}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 多实例数据自动隔离到 volume 内 instances/<id>/；单实例兼容根目录
      - warp-data:/var/lib/cloudflare-warp
    # 容器访问宿主机代理：UPSTREAM_SOCKS5=socks5://host.docker.internal:端口
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 多实例 netns 需要
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    # 若多实例 netns 仍失败，可改为 privileged: true
    privileged: false

volumes:
  warp-data:
